<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics | Conquistas</title>

    <link rel="stylesheet" href="../css/navbarDashboard.css">
    <link rel="stylesheet" href="../css/conquistasDashboard.css">

    <!-- Fontes pega do Google fontes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
</head>

<script src="../js/sessao.js"></script>

<body onload="exibirConquistas()">
    <div class="conteudo-total">
        <div class="conteudo-navbar">
            <div class="navbar">
                <a class="link_logo_home" href="dashboard.html"><img src="../assets/home/logo-white.png" alt=""></a>
                <div class="titulo-nome">
                    <h2>Bem vindo,<span class="nome-usuario" id="usuario">Stylish!</span></h1>
                </div>
                <div class="links-dashboard">
                    <div class="pagina">
                        <a href="cadastrarPartida.html">
                            <div class="texto-pagina">
                                <h2 class="nome-pagina">Cadastrar</h2>
                                <img src="../assets/dashboard/cadastro-cops.png" alt="">
                            </div>
                        </a>
                    </div>
                    <div class="pagina">
                        <a href="analise.html">
                            <div class="texto-pagina">
                                <h2 class="nome-pagina">Position Graphics</h2>
                                <img src="../assets/dashboard/mapeamento.png" alt="">
                            </div>
                        </a>
                    </div>
                    <div class="pagina">
                        <a href="conquista.html">
                            <div class="texto-pagina">
                                <h2 class="nome-pagina">Conquistas</h2>
                                <img src="../assets/dashboard/titulos.png" alt="">
                            </div>
                        </a>
                    </div>
                    <div class="pagina">
                        <a href="">
                            <div class="texto-pagina">
                                <h2 class="nome-pagina">Setup</h2>
                                <img src="../assets/dashboard/setup.png" alt="">
                            </div>
                        </a>
                    </div>
                </div>
                <div class="dashboard-sair">
                    <button class="texto-sair" onclick="limparSessao()">
                        <h2 class="nome-sair">Sair</h2>
                        <img src="../assets/dashboard/sair.png" alt="">
                    </button>
                </div>
            </div>
        </div>

        <div class="conteudo-dashboard">
            <div class="conteudo-cadastro-conquista" id="mural_titulos">
                <div class="titulo-conquista">
                    <div class="fundo-titulo-conquista">
                        <h1>Visualize suas conquistas</h1>
                        <img src="../assets/dashboard/titulos.png" alt="">
                    </div>
                </div>
                <div class="conquistas_dados">
                    <div class="dados-titulos" id="div_dados">
                    </div>

                </div>
            </div>

            <div class="botao-adicionar" id="botao_adicionar" style="display: block;">
                <button onclick="adicionar()">Adicionar</button>
            </div>

            <div class="conteudo-cadastro-partida" id="tela_cadastro_conquista" style="display: none;">
                <div class="titulo-cadastro-partida">
                    <div class="fundo-titulo-partida">
                        <h1 id="texto-cadastro">Cadastrar titulo</h1>
                    </div>
                </div>
                <div class="campos-leitura">
                    <div class="inputs-cadastro">
                        <p class="texto-cadastro">Insira o Titulo:</p>
                        <input type="text" id="ipt_titulo" placeholder="Champion MVP Circuit">
                    </div>
                </div>
                <div class="links-butao">
                    <button class="buttao-funcao-cadastrar" onclick="cadastrarConquista()">Cadastrar Titulo</button>
                </div>
            </div>

        </div>
    </div>

</body>

</html>

<script>
    function adicionar() {
        mural_titulos.style.display = "none";
        tela_cadastro_conquista.style.display = "block";
        botao_adicionar.style.display = "none";
    }

    function exibirConquistas() {
        var idUsuario = sessionStorage.ID_USUARIO;
        fetch(`/conquistas/titulos/${idUsuario}`)
            .then(resposta => {
                resposta.json().then(json => {
                    json.forEach((item) => {
                        div_dados.innerHTML += `<h2 id="texto_titulo">${item.titulo}</h2>  <img src="../assets/icon_conquista/edit.png" alt="">
                        <img src="../assets/icon_conquista/trash.png" alt="">`;
                    });
                })
            }).catch(erro => {
                console.error(erro);
            })
    }
</script>
