<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics | Metricas</title>

    <link rel="stylesheet" href="../css/navbarDashboard.css">
    <link rel="stylesheet" href="../css/metricasDashboard.css">

    <!-- Fontes pega do Google fontes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<script src="../js/sessao.js"></script>

<body>
    <div class="conteudo-total">
        <div class="conteudo-navbar">
            <div class="navbar">
                <a class="link_logo_home" href="dashboard.html"><img src="../assets/home/logo-white.png" alt=""></a>
                <div class="titulo-nome">
                    <h2>Bem vindo,<span class="nome-usuario" id="usuario">Stylish!</span></h1>
                </div>
                <div class="links-dashboard">
                    <div class="pagina">
                        <a href="cadastrarPartida.html">
                            <div class="texto-pagina">
                                <h2 class="nome-pagina">Cadastrar</h2>
                                <img src="../assets/dashboard/cadastro-cops.png" alt="">
                            </div>
                        </a>
                    </div>
                    <div class="pagina">
                        <a href="analise.html">
                            <div class="texto-pagina">
                                <h2 class="nome-pagina">Position Graphics</h2>
                                <img src="../assets/dashboard/mapeamento.png" alt="">
                            </div>
                        </a>
                    </div>
                    <div class="pagina">
                        <a href="metricas-graf.html">
                            <div class="texto-pagina">
                                <h2 class="nome-pagina">Metrics Graphics</h2>
                                <img src="../assets/dashboard/radar-icon.png" alt="">
                            </div>
                        </a>
                    </div>
                    <div class="pagina">
                        <a href="conquista.html">
                            <div class="texto-pagina">
                                <h2 class="nome-pagina">Conquistas</h2>
                                <img src="../assets/dashboard/titulos.png" alt="">
                            </div>
                        </a>
                    </div>
                </div>
                <div class="dashboard-sair">
                    <button class="texto-sair" onclick="limparSessao()">
                        <h2 class="nome-sair">Sair</h2>
                        <img src="../assets/dashboard/sair.png" alt="">
                    </button>
                </div>
            </div>
        </div>

        <div class="conteudo-dashboard">
            <div class="conteudo-metricas">
                <div class="titulo-metricas">
                    <h1>Analise o seu <span class="cor_amarela">desempenho!</span></h1>
                </div>

                <div class="graficos-metricas">
                    <div class="grafico-esquerda">
                        <div>
                            <canvas id="grafico_radar"></canvas>
                        </div>
                    </div>
                    <div class="grafico-direita">
                        <canvas id="grafico_historico"></canvas>
                    </div>
                </div>

            </div>

        </div>
    </div>


</body>

</html>

<script>
    validarSessao();
    
    const winRating_grafico = document.getElementById('grafico_radar');

    const data_radar = {
        labels: [
            'Eating',
            'Drinking',
            'Sleeping',
            'Designing',
            'Coding',
            'Cycling',
            'Running'
        ],
        datasets: [{
            label: 'Win rating por Mapa',
            data: [65, 59, 90, 81, 56, 55, 40],
            fill: true,
            backgroundColor: 'rgba(255, 140, 0, 0.2)',
            borderColor: 'rgb(255, 140, 0)',
            pointBackgroundColor: 'rgb(255, 140, 0)',
            pointBorderColor: '#111827',
            pointHoverBackgroundColor: '#fff',
            pointHoverBorderColor: 'rgb(255, 140, 0)'
        }]
    };

    const config_radar = {
        type: 'radar',
        data: data_radar,
        options: {
            elements: {
                line: {
                    borderWidth: 3
                }
            }, scales: {
                r: { // Escala Radial
                    angleLines: {
                        color: '#58A6FF'
                    },
                    grid: { // As linhas circulares de fundo
                        color: '#58A6FF'
                    },
                    pointLabels: { // A cor dos textos
                        color: 'white',
                        font: {
                            size: 14,
                            weight: 'bold'
                        }
                    },
                    ticks: {
                        display: false
                    }
                },
            },
            plugins: {
                legend: {
                    labels: {
                        color: '#FFC116',
                        font: {
                            size: 20,
                            weight: 'bold'
                        }
                    }
                }
            }
        },

    };

    let winRating = new Chart(winRating_grafico, config_radar);

    // Grafico de Histórico
    const hitorico_grafico = document.getElementById('grafico_historico');

    const data_linha = {
        labels: ['Partida 1', 'Partida 2', 'Partida 3', 'Partida 4', 'Partida 5', 'Partida 6'],

        datasets: [{
            label: 'K/D Ratio',
            data: [1.2, 1.5, 1.8, 2.1, 1.9, 2.4],
            fill: true,
            borderColor: '#58A6FF',
            backgroundColor: 'rgba(88, 166, 255, 0.10)',
            pointBackgroundColor: '#58A6FF',
            pointHoverBackgroundColor: '#FF8C00',
            pointRadius: 5,
            pointHoverRadius: 8,
            borderWidth: 3,

            tension: 0.4
        }]
    };

    const config_linha = {
        type: 'line',
        data: data_linha,
        options: {
            responsive: true,
            maintainAspectRatio: false,

            plugins: {
                legend: {
                    labels: {
                        color: '#FFC116',
                        font: {
                            size: 16,
                            weight: 'bold'
                        }
                    }
                }
            },

            scales: {
                x: {
                    ticks: {
                        color: 'white'
                    },

                    grid: {
                        color: 'rgba(88, 166, 255, 0.05)'
                    }
                },

                y: {
                    beginAtZero: true,

                    ticks: {
                        color: 'white'
                    },

                    grid: {
                        color: 'rgba(88, 166, 255, 0.08)'
                    }
                }
            }
        }
    };

    let historico = new Chart(hitorico_grafico, config_linha);


</script>
